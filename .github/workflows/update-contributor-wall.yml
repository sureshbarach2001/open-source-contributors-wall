name: Update Contributor Wall

on:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "contributors/*.json"
      - "schema.json"
      - "scripts/generate_contributors_wall.py"

permissions:
  contents: write

jobs:
  update-wall:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate contributor wall
        run: python scripts/generate_contributors_wall.py

      - name: Commit updated README if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update contributor wall"
          git push
