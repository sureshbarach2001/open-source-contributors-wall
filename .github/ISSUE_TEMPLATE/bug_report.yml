name: Bug Report
description: Report a problem in the repository
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Explain the problem clearly.
      placeholder: The validation workflow failed even though my JSON is valid.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
